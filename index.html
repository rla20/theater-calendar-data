<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대학로 연극·뮤지컬 캘린더</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; display: flex; height: 100vh; overflow: hidden; }
    
    /* 왼쪽 메인 목록 영역 */
    .main-container { flex: 1; padding: 24px; overflow-y: auto; height: 100vh; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub-desc { font-size: 13px; color: #6e6e73; margin-bottom: 16px; }
    
    .filter-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .date-scroll-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid #e5e5ea; }
    .btn-tag, .date-tab { background: #e5e5ea; color: #1d1d1f; border: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .btn-tag.active, .date-tab.active { background: #000; color: #fff; }
    
    .show-card { background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .show-card:hover { background: #f0f0f5; }
    .show-card img { width: 50px; height: 66px; object-fit: cover; border-radius: 6px; background: #e5e5ea; }
    .card-title { font-size: 15px; font-weight: 700; margin: 4px 0 2px 0; color: #1d1d1f; }
    .card-venue { font-size: 12px; color: #86868b; }
    .badge-blue { background: #e8f0fe; color: #1a73e8; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .badge-gray { background: #f2f2f7; color: #555; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-left: 4px; }
    
    /* 우측 상세정보 패널 (백지 문제 수정 완료) */
    .detail-pane { width: 380px; background: #ffffff !important; color: #1d1d1f !important; border-left: 1px solid #d2d2d7; height: 100vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: -4px 0 16px rgba(0,0,0,0.08); flex-shrink: 0; z-index: 100; }
    .close-btn { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: #e5e5ea; border: none; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #d1d1d6; }
    .detail-poster { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: #e5e5ea; }
    .detail-title { font-size: 20px; font-weight: 800; margin: 8px 0 6px 0; color: #1d1d1f; line-height: 1.3; }
    .section-label { font-size: 12px; font-weight: 700; color: #86868b; margin-top: 18px; margin-bottom: 6px; text-transform: uppercase; }
    .info-box { background: #f9f9fb; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; border: 1px solid #f0f0f2; color: #333; word-break: break-all; }
    .vendor-btn { display: inline-block; background: #0071e3; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 6px; margin-bottom: 6px; }
    .empty-msg { padding: 40px; text-align: center; color: #86868b; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app-root" style="display: flex; width: 100%;"></div>

  <script>
  (function () {
    var RAW_BASE = "https://raw.githubusercontent.com/rla20/theater-calendar-data/main";
    var JSON_URL = RAW_BASE + "/data/shows_latest.json?v=" + Date.now();

    var VENDOR_MAP = { interpark: "인터파크", nolticket: "NOL티켓", ticketlink: "티켓링크", yes24: "예스24", naver: "네이버" };

    var root = document.getElementById("app-root");
    root.innerHTML = '<div class="main-container"><div class="empty-msg">공연 데이터를 불러오는 중...</div></div>';

    fetch(JSON_URL)
      .then(function (res) {
        if (!res.ok) throw new Error("데이터를 불러올 수 없습니다.");
        return res.json();
      })
      .then(function (shows) {
        shows.forEach(function (s) {
          if (s.poster && !s.poster.startsWith("http")) {
            s.poster = RAW_BASE + "/" + s.poster;
          }
          var venue = s.fcltynm || s.venue || "";
          s.isDaehakro = (s.area === "대학로") || venue.includes("대학로") || venue.includes("혜화");
        });
        initApp(shows);
      })
      .catch(function (err) {
        root.innerHTML = '<div class="main-container"><div class="empty-msg">데이터 로드 실패: ' + err.message + '</div></div>';
      });

    function initApp(shows) {
      var state = { genre: null, region: 'daehakro', day: null, detail: null };

      // 클릭 이벤트 핸들러
      root.addEventListener('click', function (e) {
        // 카드 클릭 시 우측 창 열기
        var card = e.target.closest('.show-card');
        if (card) {
          var showId = card.getAttribute('data-show-id');
          state.detail = shows.find(function (s) { return String(s.mt20id) === String(showId); }) || null;
          render();
          return;
        }

        // 닫기 버튼 클릭
        if (e.target.classList.contains('close-btn')) {
          state.detail = null;
          render();
          return;
        }

        // 필터 버튼 클릭
        var filterBtn = e.target.closest('[data-filter]');
        if (filterBtn) {
          var type = filterBtn.getAttribute('data-type');
          var val = filterBtn.getAttribute('data-val') || null;
          state[type] = val;
          render();
          return;
        }
      });

      function render() {
        var filtered = shows.filter(function (s) {
          var genreName = s.genrenm || s.genre;
          if (state.genre && genreName !== state.genre) return false;
          if (state.region === 'daehakro' && !s.isDaehakro) return false;
          if (state.region === 'other' && s.isDaehakro) return false;

          if (state.day) {
            var dFrom = (s.prfpdfrom || s.startDate || '').replace(/\./g, '-');
            var dTo = (s.prfpdto || s.endDate || '').replace(/\./g, '-');
            if (dFrom && state.day < dFrom) return false;
            if (dTo && state.day > dTo) return false;
          }
          return true;
        });

        var genres = Array.from(new Set(shows.map(function (s) { return s.genrenm || s.genre; }).filter(Boolean)));
        
        var datesSet = new Set();
        shows.forEach(function (s) {
          var startDate = s.prfpdfrom || s.startDate;
          if (startDate) datesSet.add(startDate.replace(/\./g, '-'));
        });
        var dates = Array.from(datesSet).sort();

        var html = '<div class="main-container">';
        html += '<h2>대학로 연극·뮤지컬 캘린더</h2>';
        html += '<div class="sub-desc">총 ' + shows.length + '개 공연 중 ' + filtered.length + '개 표시</div>';

        // 지역 탭
        html += '<div class="filter-group">';
        html += chip('🎭 대학로 공연', state.region === 'daehakro', 'region', 'daehakro');
        html += chip('🏛️ 기타 서울 지역', state.region === 'other', 'region', 'other');
        html += chip('전체 보기', state.region === null, 'region', '');
        html += '</div>';

        // 장르 탭
        html += '<div class="filter-group">';
        html += chip('전체 장르', state.genre === null, 'genre', '');
        genres.forEach(function (g) { html += chip(g, state.genre === g, 'genre', g); });
        html += '</div>';

        // 날짜 탭
        html += '<div class="date-scroll-container">';
        html += dateTab('전체 날짜', state.day === null, '');
        dates.forEach(function (d) { html += dateTab(d, state.day === d, 'day', d); });
        html += '</div>';

        // 목록 출력
        if (filtered.length === 0) {
          html += '<div class="empty-msg">조건에 해당하는 공연이 없습니다.</div>';
        } else {
          filtered.forEach(function (s) {
            var title = s.prfnm || s.title || '제목 없음';
            var venue = s.fcltynm || s.venue || '장소 미정';
            var dFrom = s.prfpdfrom || s.startDate || '';
            var dTo = s.prfpdto || s.endDate || '';
            var genreName = s.genrenm || s.genre || '공연';

            html += '<div class="show-card" data-show-id="' + s.mt20id + '">';
            html += '<img src="' + (s.poster || '') + '" alt="">';
            html += '<div>';
            html += '<span class="badge-blue">' + escapeHtml(genreName) + '</span>';
            if(s.isDaehakro) html += '<span class="badge-gray">대학로</span>';
            html += '<div class="card-title">' + escapeHtml(title) + '</div>';
            html += '<div class="card-venue">' + escapeHtml(venue) + ' (' + escapeHtml(dFrom) + ' ~ ' + escapeHtml(dTo) + ')</div>';
            html += '</div></div>';
          });
        }
        html += '</div>';

        // 우측 상세정보창
        if (state.detail) {
          html += renderDetail(state.detail);
        }

        root.innerHTML = html;
      }

      function chip(label, active, type, val) {
        return '<button class="btn-tag' + (active ? ' active' : '') + '" data-filter data-type="' + type + '" data-val="' + (val || '') + '">' + escapeHtml(label) + '</button>';
      }

      function dateTab(label, active, type, val) {
        return '<button class="date-tab' + (active ? ' active' : '') + '" data-filter data-type="day" data-val="' + (val || '') + '">' + escapeHtml(label) + '</button>';
      }

      function renderDetail(s) {
        var title = s.prfnm || s.title || '제목 없음';
        var venue = s.fcltynm || s.venue || '장소 미정';
        var dFrom = s.prfpdfrom || s.startDate || '';
        var dTo = s.prfpdto || s.endDate || '';
        var genreName = s.genrenm || s.genre || '공연';
        
        var timeInfo = s.dtguidance || s.time || '정보 없음';
        var runtimeInfo = s.prfruntime || s.runtime || '';
        var castInfo = s.prfcast || s.cast || '정보 없음';
        var priceInfo = s.pcseguidance || s.price || '정보 없음';

        var html = '<div class="detail-pane">';
        html += '<button class="close-btn">✕</button>';
        if (s.poster) {
          html += '<img class="detail-poster" src="' + s.poster + '" alt="">';
        }
        html += '<span class="badge-blue">' + escapeHtml(genreName) + '</span>';
        html += '<div class="detail-title">' + escapeHtml(title) + '</div>';
        html += '<div class="card-venue">' + escapeHtml(venue) + ' · ' + escapeHtml(dFrom) + ' ~ ' + escapeHtml(dTo) + '</div>';
        
        html += '<div class="section-label">⏰ 공연 시간 / 러닝타임</div>';
        html += '<div class="info-box">' + escapeHtml(timeInfo) + (runtimeInfo ? ' (' + escapeHtml(runtimeInfo) + ')' : '') + '</div>';
        
        html += '<div class="section-label">👥 출연진 / 제작진</div>';
        html += '<div class="info-box">' + escapeHtml(castInfo) + '</div>';

        html += '<div class="section-label">💰 티켓 가격</div>';
        html += '<div class="info-box">' + escapeHtml(priceInfo) + '</div>';

        if (s.vendors && Object.keys(s.vendors).length > 0) {
          html += '<div class="section-label">🔗 예매처 바로가기</div>';
          for (var vendorKey in s.vendors) {
            var url = s.vendors[vendorKey];
            var vendorName = VENDOR_MAP[vendorKey] || vendorKey;
            if (url) {
              html += '<a class="vendor-btn" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(vendorName) + ' 예매</a>';
            }
          }
        }

        html += '</div>';
        return html;
      }

      render();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  })();
  </script>
</body>
</html>
